[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oatk"
dynamic = ["version"]
description = "A collection of useful functions for dealing with OAuth"
readme = "README.md"
license = "MIT"
authors = [
  { name = "Christophe VG", email = "contact@christophe.vg" }
]
keywords = ["oauth", "human"]
classifiers = [
  "Topic :: Security :: Cryptography",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Development Status :: 4 - Beta",
]
requires-python = ">=3.10"
dependencies = [
  "pyjwt",
  "cryptography",
  "authlib",
  "requests",
  "fire",
  "python-dotenv",
  "flask",
  "flask-cors",
  "flask-restful",
  "pymongo",
]

[project.optional-dependencies]
all = [
  "pytest",
  "pytest-cov",
  "pytest-asyncio",
  "pytest-httpx",
  "ruff",
  "mypy",
  "coverage",
  "tox>=4.0.0",
  "tox-uv>=1.0.0",
  "httpx",
  "anyio",
  "quart",
  "hypercorn",
  "fastapi",
  "uvicorn",
]
dev = [
  "pytest",
  "pytest-cov",
  "pytest-asyncio",
  "pytest-httpx",
  "ruff",
  "mypy",
  "coverage",
  "tox>=4.0.0",
  "tox-uv>=1.0.0",
]
run = [
  "gunicorn",
  "eventlet",
]
async = [
  "httpx",
  "anyio",
]
quart = [
  "quart",
  "hypercorn",
  "httpx",
  "anyio",
]
fastapi = [
  "fastapi",
  "uvicorn",
  "httpx",
  "anyio",
]
docs = [
  "sphinx>=5.0.0",
  "sphinx-rtd-theme>=1.0.0",
  "sphinx-autodoc-typehints>=1.19.0",
]

[project.urls]
Homepage = "https://github.com/christophevg/oatk"
Repository = "https://github.com/christophevg/oatk"

[project.scripts]
oatk = "oatk.__main__:cli"

[tool.hatch.build]
sources = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/oatk"]

[tool.hatch.version]
path = "src/oatk/__init__.py"
pattern = "__version__ = ['\"](?P<version>[^'\"]+)['\"]"

[tool.ruff]
target-version = "py310"
line-length = 88
indent-width = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # Pyflakes
  "I",      # isort
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "UP",     # pyupgrade
  "ARG",    # flake8-unused-arguments
  "SIM",    # flake8-simplify
]
ignore = [
  "E501",   # line too long (handled by formatter)
  "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["oatk"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_context = true
show_column_numbers = true

[[tool.mypy.overrides]]
module = [
  "jwt.*",
  "authlib.*",
  "cryptography.*",
  "flask.*",
  "flask_cors",
  "flask_restful",
  "pymongo.*",
  "requests.*",
  "fire",
  "AppKit",
  "quart.*",
  "fastapi.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["oatk.fake.*", "oatk"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
  "*/tests/*",
  "*/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.tox]
env_list = ["py310", "py311", "py312"]

[tool.tox.env_run_base]
description = "run tests with pytest"
commands_pre = [
  ["uv", "pip", "install", "-e", ".[all]"],
  ["uv", "pip", "install", "pytest", "pytest-cov", "pytest-asyncio", ],
]
commands = [
  ["pytest", "tests", "-v", "--cov=src", "--cov-report=term-missing"],
]

[tool.tox.env.py310]
base_python = ["python3.10"]

[tool.tox.env.py311]
base_python = ["python3.11"]

[tool.tox.env.py312]
base_python = ["python3.12"]
